name: Ejecutar Tests y Actualizar Early

# Se ejecuta solo cuando hacemos push a la rama 'main'
on:
  push:
    branches:
      - main

# Permisos para que la acción pueda hacer el 'push' a la rama early
permissions:
  contents: write

jobs:
  test-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Importante para poder ver todas las ramas

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Tests
        run: mvn test

      - name: Actualizar rama early si los tests pasan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout early
          git merge origin/main --no-edit
          git push origin early
